name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        working-directory: contracts
        run: cargo fmt --check
      - name: Unit tests
        working-directory: contracts
        run: cargo test
      - name: Clippy
        working-directory: contracts
        run: cargo clippy --all-targets -- -D warnings
