name: CI
on:
  pull_request:
  push:
    branches: [main, 'feat/issues-13-16-warranty-client']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: JS tests
        run: node --test packages/sdk/test/*.test.mjs apps/api/test/*.test.mjs apps/web/tests/*.test.mjs
      - name: Format
        working-directory: contracts
        run: cargo fmt --check
      - name: Unit tests
        working-directory: contracts
        run: cargo test
      - name: Clippy
        working-directory: contracts
        run: cargo clippy --all-targets -- -D warnings
