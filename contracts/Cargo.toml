[package]
name = "sorobond"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "Apache-2.0"
description = "Experimental Soroban warranty-bond deposit contract; no payout mechanism is deployed"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "=29.0.1"

[dev-dependencies]
soroban-sdk = { version = "=29.0.1", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
