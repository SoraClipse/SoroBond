<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoroBond warranty terms</title><style>body{font:16px system-ui;margin:auto;max-width:780px;padding:20px;background:#f4f6fc;color:#15263e}main{background:white;padding:24px;border-radius:16px}label{display:block;margin-top:12px}input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #abb8c8;font:inherit}button{background:#263faf;color:white;margin-top:16px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}p{line-height:1.5}</style><main><h1>Negotiate warranty bond</h1><p>Review the exact immutable agreement before signing. Signatures do not deposit funds. This is not a deployed contract service.</p><form id="terms"><label>Network<select name="network"><option>testnet</option><option>public</option></select></label><label>Asset<select name="asset"><option>XLM</option><option>USDC</option></select></label><label>Buyer wallet<input name="buyer" required maxlength="500"></label><label>Seller wallet<input name="seller" required maxlength="500"></label><label>Item<input name="item" required maxlength="500"></label><label>Coverage<textarea name="coverage" required maxlength="500"></textarea></label><label>Exclusions<textarea name="exclusions" required maxlength="500"></textarea></label><label>Resolver wallet<input name="resolver" required maxlength="500"></label><label>Bond amount<input name="bondAmount" required pattern="[0-9]+(\.[0-9]{1,7})?"></label><label>Expiration (Unix seconds)<input type="number" min="1" step="1" name="expiresAt" required></label><button>Review locked summary</button></form><section id="review" hidden><h2>Agreement to co-sign</h2><pre id="summary"></pre><button id="buyerSign">Sign as buyer</button><button id="sellerSign">Sign as seller</button><p role="status" id="status"></p></section></main><script type="module">
import{canonicalTerms,termsDigest,coSign,pairSignatures}from'/agreement.mjs';
const form=document.querySelector('#terms'),review=document.querySelector('#review'),summary=document.querySelector('#summary'),status=document.querySelector('#status');let terms,digest,signatures={};
form.onsubmit=e=>{e.preventDefault();try{terms=Object.fromEntries(new FormData(form));terms.expiresAt=Number(terms.expiresAt);digest=termsDigest(terms);summary.textContent=canonicalTerms(terms)+'\nSHA-256: '+digest;review.hidden=false;form.querySelectorAll('input,select,textarea').forEach(x=>x.disabled=true);status.textContent='Review exact network, asset, coverage, exclusions, resolver, amount and expiration.';}catch(err){status.textContent=err.message;review.hidden=false;}};
async function signAs(role){try{if(!terms||termsDigest(terms)!==digest)throw Error('Terms changed');const wallet=window.sorobondWallet;if(!wallet?.connect||!wallet?.signDigest)throw Error('Connect a compatible signing wallet');const connected=await wallet.connect();const signer={connected:!!connected.address,network:connected.network,address:connected.address,sign:(d,p)=>wallet.signDigest(d,p)};if(connected.address!==terms[role])throw Error('Wrong wallet for '+role);signatures[role]=await coSign(terms,signer,digest);status.textContent=role+' signed digest '+digest;if(signatures.buyer&&signatures.seller){pairSignatures(terms,signatures.buyer,signatures.seller);status.textContent='Both signatures collected for identical terms. Cryptographic signature verification and ledger funding require integration.';}}catch(err){status.textContent=err.message;}}
document.querySelector('#buyerSign').onclick=()=>signAs('buyer');document.querySelector('#sellerSign').onclick=()=>signAs('seller');
</script></html>
